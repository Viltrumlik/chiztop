# Mavjud saytga qo'shiladigan blok -- yangi DNS va sertifikat kerak emas.
#
# /etc/nginx/sites-available/satapp ichidagi 443 server blokiga, `location /`
# dan OLDIN qo'ying. Keyin: nginx -t && systemctl reload nginx
#
# `^~` ataylab: u regex location'larni tekshirishni butunlay to'xtatadi,
# shunda saytdagi `\.(js|css|...)$` kabi qoidalar o'yin fayllarini
# tortib ketmaydi.
#
# proxy_pass oxiridagi `/` ham ataylab: u `/chiz/` prefiksini olib
# tashlaydi, ya'ni `/chiz/ws` serverga `/ws` bo'lib boradi.

    location ^~ /chiz/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
