# /etc/nginx/sites-available/chiztop  ->  sites-enabled/ ga symlink
#
# Bu faqat HTTP. TLS blokini certbot o'zi qo'shadi:
#   sudo certbot --nginx -d chiz.mastersat.uz
#
# Sababi: sertifikat hali yo'q paytda ssl_certificate yo'lini yozsak,
# `nginx -t` yiqiladi va reload butun serverdagi saytlarni to'xtatadi.

server {
    listen 80;
    listen [::]:80;
    server_name chiz.mastersat.uz;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;

        # WebSocket uchun shart. Bu ikki qator bo'lmasa /ws ulanmaydi va
        # o'yin "Qayta ulanmoqda..." deb aylanib qoladi.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ulanish o'yin davomida ochiq turadi; sukutdagi 60s qolsa
        # WebSocket har daqiqada uziladi.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
